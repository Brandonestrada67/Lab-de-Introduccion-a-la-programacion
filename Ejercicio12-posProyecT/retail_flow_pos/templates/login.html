<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Acceso - Retail Flow POS</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 h-screen flex items-center justify-center">
    <div class="bg-white rounded-2xl shadow-2xl flex overflow-hidden max-w-4xl w-full mx-4">
        <div class="w-1/2 p-12 bg-slate-50 border-r">
            <div class="text-blue-600 font-black text-2xl mb-8">Retail Flow POS</div>
            <div class="space-y-6">
                <div>
                    <label class="text-[10px] font-black text-slate-400 uppercase">Terminal ID</label>
                    <div class="text-xl font-mono font-bold text-slate-700">TERM-042-XP</div>
                </div>
                <div>
                    <label class="text-[10px] font-black text-slate-400 uppercase">Estado del Sistema</label>
                    <div class="text-green-600 font-bold flex items-center gap-2">
                        <i class="fas fa-check-circle"></i> Sincronizado
                    </div>
                </div>
            </div>
        </div>
        <div class="w-1/2 p-12">
            <h2 class="text-2xl font-bold text-slate-800 mb-2">Acceso de Personal</h2>
            <p class="text-sm text-slate-500 mb-8">Ingrese su código PIN de 6 dígitos</p>
            
            <div class="grid grid-cols-3 gap-4 mb-8">
                {% for i in range(1, 10) %}
                <button class="h-16 rounded-xl bg-slate-100 text-xl font-bold text-slate-700 hover:bg-blue-600 hover:text-white transition">{{ i }}</button>
                {% endfor %}
                <button class="h-16 rounded-xl bg-red-50 text-red-600 font-bold hover:bg-red-600 hover:text-white transition">C</button>
                <button class="h-16 rounded-xl bg-slate-100 text-xl font-bold text-slate-700 hover:bg-blue-600 hover:text-white transition">0</button>
                <a href="/checkout" class="h-16 rounded-xl bg-blue-600 text-white flex items-center justify-center hover:bg-blue-700 transition">
                    <i class="fas fa-sign-in-alt"></i>
                </a>
            </div>
        </div>
    </div>
</body>
</html>
