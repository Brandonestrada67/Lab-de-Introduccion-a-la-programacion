{% extends "layout.html" %}
{% block content %}
<div class="flex flex-col items-center justify-center h-full bg-slate-100 p-4 overflow-y-auto">
    <div class="bg-white p-8 rounded-xl shadow-2xl border-2 border-blue-500 text-center max-w-md w-full my-auto">
        <h2 class="text-2xl font-bold mb-2">Escanear Producto</h2>
        <p class="text-gray-500 mb-4">Apunte la cámara al código de barras.</p>
        
        {% if error %}
        <div class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded relative mb-4" role="alert">
            <span class="block sm:inline font-bold">{{ error }}</span>
        </div>
        {% endif %}

        <div class="mb-6 w-full overflow-hidden rounded-lg border-4 border-slate-800 bg-black relative">
            <video id="video" class="w-full h-64 object-cover"></video>
            <div class="absolute top-1/2 left-0 w-full h-0.5 bg-red-500 shadow-[0_0_15px_3px_red] animate-pulse"></div>
        </div>
        
        <form method="POST" id="scan-form">
            <input type="text" name="sku" id="sku-input" autofocus 
                   class="w-full p-4 text-center text-2xl tracking-widest border-2 border-gray-300 rounded-lg focus:border-blue-500 focus:outline-none mb-4" 
                   placeholder="INGRESE SKU...">
            <button type="submit" class="w-full bg-blue-600 text-white py-4 rounded-lg font-bold hover:bg-blue-700 transition">
                PROCESAR ESCANEO
            </button>
        </form>
        
        <a href="{{ url_for('checkout') }}" class="mt-6 inline-block text-blue-600 font-semibold hover:underline">
            <i class="fas fa-arrow-left mr-2"></i> Volver a Caja
        </a>
    </div>
</div>

<script type="text/javascript" src="https://unpkg.com/@zxing/library@latest/umd/index.min.js"></script>
<script>
    window.addEventListener('load', function () {
        // Iniciar el lector
        const codeReader = new ZXing.BrowserMultiFormatReader();
        
        // Iniciar la decodificación desde la cámara predeterminada
        codeReader.decodeFromVideoDevice(null, 'video', (result, err) => {
            if (result) {
                // Si encuentra un código
                document.getElementById('sku-input').value = result.text;
                
                // Apagar la cámara tras leer el código
                codeReader.reset();
                
                // Enviar el formulario para agregar al carrito
                document.getElementById('scan-form').submit();
            }
            if (err && !(err instanceof ZXing.NotFoundException)) {
                console.error("Error de lectura:", err);
            }
        }).catch(err => {
            console.error("Error al iniciar cámara:", err);
            alert("No se pudo acceder a la cámara. Asegúrate de estar en http://127.0.0.1:5000 y dar permisos.");
        });
    });
</script>
{% endblock %}
