{% extends "layout.html" %}
{% block content %}
<div class="p-8">
    <h2 class="text-2xl font-black text-slate-800 mb-6">Autorizaciones Pendientes</h2>
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        {% for auth in pending %}
        <div class="bg-white p-6 rounded-2xl border-2 border-l-8 border-l-blue-500 shadow-sm flex justify-between items-center">
            <div>
                <div class="text-[10px] font-black text-blue-500 uppercase">{{ auth.tipo }}</div>
                <div class="text-lg font-bold text-slate-800">{{ auth.motivo }}</div>
                <div class="text-xs text-slate-400">Solicitado por: {{ auth.usuario }}</div>
            </div>
            <div class="flex gap-2">
                <button class="bg-green-100 text-green-700 px-4 py-2 rounded-lg font-bold text-sm hover:bg-green-600 hover:text-white transition">Aprobar</button>
                <button class="bg-red-100 text-red-700 px-4 py-2 rounded-lg font-bold text-sm hover:bg-red-600 hover:text-white transition">Rechazar</button>
            </div>
        </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
